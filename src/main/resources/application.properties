# ==============================
# General configuration
# ==============================
spring.application.name=movies-api
server.port=8080

# ==============================
# Default active profile: h2 (see application-h2.properties).
# Switch to "mysql" or "h2file" with -Dspring-boot.run.profiles=mysql
# ==============================
spring.profiles.active=h2

# ==============================
# Base prefix for API routes (versioning)
# ==============================
api-endpoint=api/v1

# ==============================
# Docker Compose Support (optional, disabled by default:
# we use our own docker-compose.yml, see README)
# ==============================
spring.docker.compose.enabled=false

# ==============================
# Error handling
# ==============================
server.error.include-message=always
server.error.include-binding-errors=always
