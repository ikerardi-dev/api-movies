# ==============================
# MySQL profile (optional).
# Usage: mvn spring-boot:run -Dspring-boot.run.profiles=mysql
# Requires MySQL to be running and a "moviesdb" database created:
#   CREATE DATABASE moviesdb;
# ==============================
spring.datasource.url=jdbc:mysql://localhost:3306/moviesdb?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC
spring.datasource.driverClassName=com.mysql.cj.jdbc.Driver
spring.datasource.username=root
spring.datasource.password=root

spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.defer-datasource-initialization=true

# With MySQL and ddl-auto=update, this only runs data.sql the first time
# (or switch it to "always" and add "INSERT IGNORE" / checks if you'd
# rather reload the sample data on every startup).
spring.sql.init.mode=always
