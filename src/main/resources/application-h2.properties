# ==============================
# "h2" profile (default): in-memory H2 database.
# Nothing needs to be installed. The schema is recreated and seeded with
# sample data on every startup (ddl-auto=create-drop), which makes the API
# easy to try out. Data does NOT persist between restarts.
# ==============================
spring.datasource.url=jdbc:h2:mem:moviesdb;DB_CLOSE_DELAY=-1
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.defer-datasource-initialization=true

spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# Loads data.sql with sample data after the schema is created
spring.sql.init.mode=always

# H2 console available at http://localhost:8080/h2-console
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

logging.level.root=warn
logging.level.org.springframework.web=debug
logging.level.org.hibernate=error
