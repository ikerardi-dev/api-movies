# ==============================
# "h2file" profile (bonus, not covered in class): H2 backed by a file
# instead of memory, so an external tool such as DBeaver can connect to it
# while the app is running, without needing Docker or installing MySQL.
#
# Usage: mvn spring-boot:run -Dspring-boot.run.profiles=h2file
#
# The database file is created at ./data/moviesdb.mv.db
# (relative to the folder the command is run from).
# "AUTO_SERVER=TRUE" lets another application (DBeaver) connect to the
# same file while the API keeps running.
# ==============================
spring.datasource.url=jdbc:h2:file:./data/moviesdb;AUTO_SERVER=TRUE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.defer-datasource-initialization=true

spring.sql.init.mode=always

spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
