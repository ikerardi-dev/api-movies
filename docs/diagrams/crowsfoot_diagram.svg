<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg width="590" height="410" viewBox="0 0 590 410" xmlns="http://www.w3.org/2000/svg">
  <title>CrowsFootDiagram</title>
  <rect width="590" height="410" fill="white"/>

  <!-- ===================== ENTITY BOXES ===================== -->

  <!-- genres -->
  <g font-family="Helvetica,Arial,sans-Serif">
    <rect x="20" y="20" width="150" height="70" fill="none" stroke="#e8720c" stroke-width="1.4"/>
    <rect x="20" y="20" width="150" height="26" fill="#e8720c"/>
    <text x="95" y="37" text-anchor="middle" font-size="14" font-weight="bold" fill="white">genres</text>
    <line x1="20" y1="68" x2="170" y2="68" stroke="#e8720c" stroke-width="1"/>
    <text x="28" y="61" font-size="12" font-weight="bold" fill="#e8720c">PK</text>
    <text x="55" y="61" font-size="12" fill="#222">id</text>
    <text x="55" y="83" font-size="12" fill="#222">name</text>
  </g>

  <!-- years -->
  <g font-family="Helvetica,Arial,sans-Serif">
    <rect x="20" y="150" width="150" height="70" fill="none" stroke="#e8720c" stroke-width="1.4"/>
    <rect x="20" y="150" width="150" height="26" fill="#e8720c"/>
    <text x="95" y="167" text-anchor="middle" font-size="14" font-weight="bold" fill="white">years</text>
    <line x1="20" y1="198" x2="170" y2="198" stroke="#e8720c" stroke-width="1"/>
    <text x="28" y="191" font-size="12" font-weight="bold" fill="#e8720c">PK</text>
    <text x="55" y="191" font-size="12" fill="#222">id</text>
    <text x="55" y="213" font-size="12" fill="#222">year_value</text>
  </g>

  <!-- actors -->
  <g font-family="Helvetica,Arial,sans-Serif">
    <rect x="20" y="280" width="170" height="114" fill="none" stroke="#e8720c" stroke-width="1.4"/>
    <rect x="20" y="280" width="170" height="26" fill="#e8720c"/>
    <text x="105" y="297" text-anchor="middle" font-size="14" font-weight="bold" fill="white">actors</text>
    <line x1="20" y1="328" x2="190" y2="328" stroke="#e8720c" stroke-width="1"/>
    <text x="28" y="321" font-size="12" font-weight="bold" fill="#e8720c">PK</text>
    <text x="55" y="321" font-size="12" fill="#222">id</text>
    <text x="55" y="343" font-size="12" fill="#222">name</text>
    <text x="55" y="365" font-size="12" fill="#222">nationality</text>
    <text x="55" y="387" font-size="12" fill="#222">date_of_birth</text>
  </g>

  <!-- movies -->
  <g font-family="Helvetica,Arial,sans-Serif">
    <rect x="320" y="20" width="230" height="180" fill="none" stroke="#e8720c" stroke-width="1.4"/>
    <rect x="320" y="20" width="230" height="26" fill="#e8720c"/>
    <text x="435" y="37" text-anchor="middle" font-size="14" font-weight="bold" fill="white">movies</text>
    <line x1="320" y1="68" x2="550" y2="68" stroke="#e8720c" stroke-width="1"/>
    <text x="328" y="61" font-size="12" font-weight="bold" fill="#e8720c">PK</text>
    <text x="355" y="61" font-size="12" fill="#222">id</text>
    <text x="355" y="83" font-size="12" fill="#222">title</text>
    <text x="355" y="105" font-size="12" fill="#222">synopsis</text>
    <text x="355" y="127" font-size="12" fill="#222">duration_minutes</text>
    <text x="355" y="149" font-size="12" fill="#222">director</text>
    <text x="328" y="171" font-size="12" font-weight="bold" fill="#e8720c">FK</text>
    <text x="355" y="171" font-size="12" fill="#222">genre_id</text>
    <text x="328" y="193" font-size="12" font-weight="bold" fill="#e8720c">FK</text>
    <text x="355" y="193" font-size="12" fill="#222">year_id</text>
  </g>

  <!-- movie_actor -->
  <g font-family="Helvetica,Arial,sans-Serif">
    <rect x="320" y="280" width="190" height="70" fill="none" stroke="#e8720c" stroke-width="1.4"/>
    <rect x="320" y="280" width="190" height="26" fill="#e8720c"/>
    <text x="415" y="297" text-anchor="middle" font-size="14" font-weight="bold" fill="white">movie_actor</text>
    <text x="328" y="321" font-size="12" font-weight="bold" fill="#e8720c">FK</text>
    <text x="355" y="321" font-size="12" fill="#222">movie_id</text>
    <text x="328" y="343" font-size="12" font-weight="bold" fill="#e8720c">FK</text>
    <text x="355" y="343" font-size="12" fill="#222">actor_id</text>
  </g>

  <!-- ===================== RELATIONSHIPS ===================== -->
  <g stroke="#333333" stroke-width="1.3" fill="none">

    <!-- genres (1) -> movies (N) : a genre has many movies -->
    <path d="M170,61 C 245,61 245,171 320,171"/>
    <line x1="180" y1="55" x2="180" y2="67"/>
    <g>
      <line x1="306" y1="171" x2="320" y2="164"/>
      <line x1="306" y1="171" x2="320" y2="171"/>
      <line x1="306" y1="171" x2="320" y2="178"/>
      <circle cx="298" cy="171" r="4" fill="white"/>
    </g>

    <!-- years (1) -> movies (N) : a year has many movies -->
    <path d="M170,191 C 245,191 245,193 320,193"/>
    <line x1="180" y1="185" x2="180" y2="197"/>
    <g>
      <line x1="306" y1="193" x2="320" y2="186"/>
      <line x1="306" y1="193" x2="320" y2="193"/>
      <line x1="306" y1="193" x2="320" y2="200"/>
      <circle cx="298" cy="193" r="4" fill="white"/>
    </g>

    <!-- movies (1) -> movie_actor (N) : a movie has many movie_actor rows -->
    <path d="M355,200 L355,280"/>
    <line x1="349" y1="210" x2="361" y2="210"/>
    <g>
      <line x1="355" y1="266" x2="348" y2="280"/>
      <line x1="355" y1="266" x2="355" y2="280"/>
      <line x1="355" y1="266" x2="362" y2="280"/>
      <circle cx="355" cy="258" r="4" fill="white"/>
    </g>

    <!-- actors (1) -> movie_actor (N) : an actor appears in many movie_actor rows -->
    <path d="M190,333 C 255,333 255,343 320,343"/>
    <line x1="200" y1="327" x2="200" y2="339"/>
    <g>
      <line x1="306" y1="343" x2="320" y2="336"/>
      <line x1="306" y1="343" x2="320" y2="343"/>
      <line x1="306" y1="343" x2="320" y2="350"/>
      <circle cx="298" cy="343" r="4" fill="white"/>
    </g>

  </g>
</svg>
